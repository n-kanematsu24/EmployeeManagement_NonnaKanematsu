<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部門一覧 — 社員情報管理システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f3f1;--sidebar-w:220px;--topbar-h:52px;
  --white:#fff;--border:#e2e0dc;
  --text-dark:#1a1a1a;--text-mid:#555;--text-soft:#999;
  --accent:#2b5ba5;--danger:#c53030;
  --hover-bg:rgba(0,0,0,.04);--active-bg:rgba(0,0,0,.07);
  --radius-sm:6px;--radius-md:10px;
  --font:'Noto Sans JP',sans-serif;--mono:'DM Mono',monospace;
  --tr:150ms ease;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text-dark);font-size:14px;line-height:1.5;display:flex}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow-y:auto;overflow-x:hidden}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo-main{font-size:13px;font-weight:700;color:var(--text-dark);letter-spacing:-.01em}
.logo-sub{font-size:10px;color:var(--text-soft);margin-top:2px;letter-spacing:.02em}
.nav-body{flex:1;padding:10px;display:flex;flex-direction:column;gap:2px}
.nav-section-label{font-size:9px;font-weight:500;color:var(--text-soft);letter-spacing:.12em;text-transform:uppercase;padding:10px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);font-size:13px;color:var(--text-mid);cursor:pointer;transition:background var(--tr),color var(--tr);text-decoration:none;user-select:none}
.nav-item svg{flex-shrink:0;opacity:.7}.nav-item:hover{background:var(--hover-bg);color:var(--text-dark)}.nav-item:hover svg{opacity:1}
.nav-item.active{background:var(--active-bg);color:var(--text-dark);font-weight:500}.nav-item.active svg{opacity:1}
.nav-item.danger{color:var(--danger)}.nav-item.danger svg{color:var(--danger)}.nav-item.danger:hover{background:#fff5f5}
.nav-divider{height:1px;background:var(--border);margin:6px 0}
.sidebar-footer{padding:14px 18px;font-size:10px;color:var(--text-soft);line-height:1.6;border-top:1px solid var(--border);flex-shrink:0}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:var(--topbar-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:10px}
.page-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm)}
.page-title{font-size:15px;font-weight:600;color:var(--text-dark);letter-spacing:-.01em}
.topbar-right{display:flex;align-items:center;gap:8px}
.lang-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:12px;font-weight:500;color:var(--text-dark);cursor:pointer;transition:background var(--tr),border-color var(--tr);user-select:none}
.lang-btn:hover{background:var(--hover-bg)}.lang-btn.open{border-color:#aaa}.lang-btn svg{opacity:.6}
.lang-btn .chevron{font-size:9px;opacity:.5;transition:transform 200ms ease;display:inline-block}.lang-btn.open .chevron{transform:rotate(180deg)}
.device-btn{display:flex;align-items:center;justify-content:center;width:34px;height:30px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--text-mid)}.device-btn:hover{background:var(--hover-bg)}
.search-area{padding:12px 24px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.search-wrap{position:relative;flex:1;max-width:420px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-soft);pointer-events:none}
.search-input{width:100%;padding:9px 14px 9px 38px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:13px;color:var(--text-dark);outline:none;transition:border-color var(--tr),box-shadow var(--tr)}
.search-input::placeholder{color:var(--text-soft)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,91,165,.1)}
.table-area{flex:1;overflow-y:auto;overflow-x:hidden}
.table-area::-webkit-scrollbar{width:6px}.table-area::-webkit-scrollbar-track{background:transparent}
.table-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}.table-area::-webkit-scrollbar-thumb:hover{background:#ccc}
.count-bar{padding:10px 24px 8px;font-size:12px;color:var(--text-soft)}
.count-bar span{font-weight:500;color:var(--text-dark)}
.dept-table{width:100%;border-collapse:collapse}
.dept-table thead{background:var(--bg);position:sticky;top:0;z-index:10}
.dept-table th{padding:10px 24px;text-align:left;font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:.06em;text-transform:uppercase;border-bottom:1.5px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;transition:color var(--tr)}
.dept-table th:hover{color:var(--text-dark)}
.dept-table th .sort-icon{display:inline-flex;flex-direction:column;margin-left:4px;opacity:.35;vertical-align:middle;gap:1px}
.dept-table th.sorted{color:var(--accent)}.dept-table th.sorted .sort-icon{opacity:1}
.dept-table td{padding:16px 24px;border-bottom:1px solid var(--border);font-size:14px;color:var(--text-dark);transition:background var(--tr)}
.dept-table tbody tr{cursor:pointer;transition:background var(--tr)}
.dept-table tbody tr:hover td{background:var(--hover-bg)}
.dept-table tbody tr:last-child td{border-bottom:none}
.dept-id{font-family:var(--mono);font-size:13px;color:var(--text-dark);font-weight:500}
.dept-code{font-family:var(--mono);font-size:13px;color:var(--text-mid)}
.empty-state{text-align:center;padding:60px 0;color:var(--text-soft);font-size:13px}
.empty-state svg{margin-bottom:12px;opacity:.3}
.lang-overlay{position:fixed;inset:0;background:rgba(0,0,0,.18);backdrop-filter:blur(1px);z-index:200;opacity:0;pointer-events:none;transition:opacity 200ms ease}
.lang-overlay.show{opacity:1;pointer-events:all}
.lang-dropdown{position:fixed;z-index:201;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:0 8px 32px rgba(0,0,0,.16);min-width:200px;overflow:hidden;opacity:0;pointer-events:none;transform:translateY(-6px) scale(.97);transform-origin:top right;transition:opacity 180ms ease,transform 180ms ease}
.lang-dropdown.show{opacity:1;pointer-events:all;transform:translateY(0) scale(1)}
.lang-dropdown-header{padding:10px 14px 8px;font-size:10px;font-weight:600;color:var(--text-soft);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--border)}
.lang-option{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background var(--tr);font-size:13px;color:var(--text-dark)}
.lang-option:hover{background:var(--hover-bg)}.lang-option.active{background:#eef3fb;color:var(--accent);font-weight:500}
.lang-flag{font-size:16px;line-height:1;flex-shrink:0}.lang-label-main{font-weight:500}
.lang-label-sub{font-size:11px;color:var(--text-soft);margin-left:auto;font-family:var(--mono)}
.lang-check{margin-left:auto;color:var(--accent);font-size:14px;display:none}.lang-option.active .lang-check{display:block}.lang-option.active .lang-label-sub{display:none}
.toast{position:fixed;bottom:24px;right:24px;background:var(--text-dark);color:#fff;padding:11px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:opacity 200ms,transform 200ms;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-main">社員情報管理システム</div>
    <div class="logo-sub">Employee Management System</div>
  </div>
  <nav class="nav-body">
    <div class="nav-section-label">社員</div>
    <a class="nav-item" href="employee_list.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      社員一覧
    </a>
    <a class="nav-item" href="employee_add.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      社員追加
    </a>
    <div class="nav-divider"></div>
    <div class="nav-section-label">部門</div>
    <a class="nav-item active" href="dept_list.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      部門一覧
    </a>
    <a class="nav-item" href="dept_add.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
      部門追加
    </a>
    <div class="nav-divider"></div>
    <a class="nav-item danger" href="#" onclick="confirmLogout(event)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      ログアウト
    </a>
  </nav>
  <div class="sidebar-footer">@2026<br>Employee Management System</div>
</aside>
 
<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <div class="page-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      </div>
      <span class="page-title">部門一覧</span>
    </div>
    <div class="topbar-right">
      <button class="lang-btn" id="langBtn" onclick="toggleLang()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="langLabel">JP</span>
        <span class="chevron">▼</span>
      </button>
      <div class="device-btn">
        <svg width="14" height="16" viewBox="0 0 14 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="1" width="12" height="18" rx="2"/><line x1="5" y1="17" x2="9" y2="17"/></svg>
      </div>
    </div>
  </header>
 
  <div class="search-area">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="部門名・IDで検索" oninput="filterTable(this.value)" autocomplete="off">
    </div>
  </div>
 
  <div class="table-area">
    <div class="count-bar">全 <span id="countNum">0</span> 件</div>
    <table class="dept-table">
      <thead>
        <tr>
          <th onclick="sortTable(0)">部門ID<span class="sort-icon"><svg width="8" height="5" viewBox="0 0 8 5"><path d="M4 0L8 5H0Z" fill="currentColor"/></svg><svg width="8" height="5" viewBox="0 0 8 5"><path d="M4 5L0 0H8Z" fill="currentColor"/></svg></span></th>
          <th onclick="sortTable(1)">部門名<span class="sort-icon"><svg width="8" height="5" viewBox="0 0 8 5"><path d="M4 0L8 5H0Z" fill="currentColor"/></svg><svg width="8" height="5" viewBox="0 0 8 5"><path d="M4 5L0 0H8Z" fill="currentColor"/></svg></span></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <div>部門が見つかりませんでした</div>
    </div>
  </div>
</div>
 
<div class="lang-overlay" id="langOverlay" onclick="closeLang()"></div>
<div class="lang-dropdown" id="langDropdown"><div class="lang-dropdown-header">言語を選択</div></div>
<div class="toast" id="toast"></div>
 
<script>
const LANGUAGES=[{code:'ja',flag:'🇯🇵',label:'日本語',sub:'Japanese',short:'JP'},{code:'en',flag:'🇺🇸',label:'English',sub:'English',short:'EN'},{code:'zh-tw',flag:'🇹🇼',label:'繁體字',sub:'Traditional',short:'TW'},{code:'zh-cn',flag:'🇨🇳',label:'简体字',sub:'Simplified',short:'CN'},{code:'ko',flag:'🇰🇷',label:'한국어',sub:'Korean',short:'KR'},{code:'es',flag:'🇪🇸',label:'Español',sub:'Spanish',short:'ES'},{code:'fr',flag:'🇫🇷',label:'Français',sub:'French',short:'FR'},{code:'de',flag:'🇩🇪',label:'Deutsch',sub:'German',short:'DE'},{code:'pt',flag:'🇧🇷',label:'Português',sub:'Portuguese',short:'PT'},{code:'it',flag:'🇮🇹',label:'Italiano',sub:'Italian',short:'IT'},{code:'vi',flag:'🇻🇳',label:'Tiếng Việt',sub:'Vietnamese',short:'VI'},{code:'th',flag:'🇹🇭',label:'ภาษาไทย',sub:'Thai',short:'TH'}];
 
let currentLang='ja', sortCol=-1, sortAsc=true, currentData=[];
 
document.addEventListener('DOMContentLoaded', async () => {
  if(localStorage.getItem('logged_in') !== 'true'){ location.replace('login.html'); return; }
  buildLangMenu();
  await loadDepartments();
});
 
async function loadDepartments(){
  try{
    const res = await fetch('/api/Department');
    if(!res.ok) throw new Error();
    currentData = await res.json();
    renderTable(currentData);
  }catch(e){
    showToast('データの取得に失敗しました');
  }
}
 
function renderTable(data){
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  document.getElementById('countNum').textContent = data.length;
  if(!data.length){ tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  tbody.innerHTML = data.map(d => `
    <tr data-id="${d.id}" class="dept-row">
      <td><span class="dept-id">${String(d.id).padStart(3,'0')}</span></td>
      <td>${d.deptName||''}</td>
    </tr>
  `).join('');
  document.querySelectorAll('.dept-row').forEach(r => {
    r.addEventListener('click', () => location.href = 'dept_detail.html?id=' + r.dataset.id);
  });
}
 
function filterTable(query){
  const q = query.trim().toLowerCase();
  const filtered = q ? currentData.filter(d =>
    String(d.id).includes(q) || (d.deptName||'').toLowerCase().includes(q)
  ) : [...currentData];
  if(sortCol >= 0) applySort(sortCol, sortAsc, filtered);
  else renderTable(filtered);
}
 
function sortTable(col){
  if(sortCol===col){ sortAsc=!sortAsc; } else { sortCol=col; sortAsc=true; }
  document.querySelectorAll('.dept-table th').forEach((th,i) => th.classList.toggle('sorted', i===col));
  applySort(col, sortAsc, currentData);
}
function applySort(col, asc, data){
  const keys = [d => String(d.id), d => d.deptName||''];
  const sorted = [...data].sort((a,b) => asc ? keys[col](a).localeCompare(keys[col](b),'ja') : keys[col](b).localeCompare(keys[col](a),'ja'));
  renderTable(sorted);
}
 
function buildLangMenu(){
  const dd=document.getElementById('langDropdown'), hdr=dd.querySelector('.lang-dropdown-header');
  dd.innerHTML=''; dd.appendChild(hdr);
  LANGUAGES.forEach(l=>{
    const opt=document.createElement('div'); opt.className='lang-option'+(l.code===currentLang?' active':'');
    opt.innerHTML=`<span class="lang-flag">${l.flag}</span><span class="lang-label-main">${l.label}</span><span class="lang-label-sub">${l.sub}</span><span class="lang-check">✓</span>`;
    opt.onclick=()=>selectLang(l); dd.appendChild(opt);
  });
}
function toggleLang(){
  const btn=document.getElementById('langBtn'), dd=document.getElementById('langDropdown');
  if(dd.classList.contains('show')){ closeLang(); return; }
  const r=btn.getBoundingClientRect();
  dd.style.top=(r.bottom+6)+'px'; dd.style.right=(window.innerWidth-r.right)+'px';
  document.getElementById('langOverlay').classList.add('show');
  dd.classList.add('show'); btn.classList.add('open');
}
function closeLang(){
  document.getElementById('langOverlay').classList.remove('show');
  document.getElementById('langDropdown').classList.remove('show');
  document.getElementById('langBtn').classList.remove('open');
}
function selectLang(l){ currentLang=l.code; document.getElementById('langLabel').textContent=l.short; buildLangMenu(); closeLang(); showToast(`言語を「${l.label}」に変更しました`); }
function confirmLogout(e){
  e.preventDefault();
  if(confirm('ログアウトしますか？')){
    try{ localStorage.removeItem('logged_in'); localStorage.removeItem('login_user'); }catch(e){}
    location.href='login.html';
  }
}
let toastTimer;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
document.addEventListener('keydown', e => {
  if(e.key==='Escape') closeLang();
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); document.getElementById('searchInput').focus(); }
});
</script>
</body>
</html>
