<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン — 社員情報管理システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f3f1;--white:#fff;--border:#e2e0dc;
  --text-dark:#1a1a1a;--text-mid:#555;--text-soft:#999;
  --accent:#2b5ba5;--danger:#c53030;
  --hover-bg:rgba(0,0,0,.04);
  --radius-sm:6px;--radius-md:10px;--radius-lg:16px;
  --font:'Noto Sans JP',sans-serif;--mono:'DM Mono',monospace;
  --tr:150ms ease;
  --sh-sm:0 1px 4px rgba(0,0,0,.06);
  --sh-md:0 4px 20px rgba(0,0,0,.08);
}
html,body{height:100%;background:var(--bg);font-family:var(--font);color:var(--text-dark);font-size:14px}
 
/* ─ トップバー右上 ─────────────────────── */
.topbar-right{
  position:fixed;top:16px;right:20px;
  display:flex;align-items:center;gap:8px;
  z-index:50;
}
.lang-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:12px;font-weight:500;color:var(--text-dark);cursor:pointer;transition:background var(--tr),border-color var(--tr);user-select:none}
.lang-btn:hover{background:var(--hover-bg)}.lang-btn.open{border-color:#aaa}.lang-btn svg{opacity:.6}
.lang-btn .chevron{font-size:9px;opacity:.5;transition:transform 200ms;display:inline-block}.lang-btn.open .chevron{transform:rotate(180deg)}
.device-btn{display:flex;align-items:center;justify-content:center;width:34px;height:30px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--text-mid)}.device-btn:hover{background:var(--hover-bg)}
 
/* ─ センターレイアウト ─────────────────── */
.page{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 20px;
}
 
.login-wrap{
  width:100%;max-width:480px;
  opacity:0;transform:translateY(20px);
  animation:fadeUp .5s ease forwards;
}
 
/* ─ タイトル ───────────────────────────── */
.brand{text-align:center;margin-bottom:40px}
.brand-title{
  font-size:28px;font-weight:700;
  letter-spacing:-.02em;line-height:1.2;
  margin-bottom:8px;color:var(--text-dark);
}
.brand-sub{
  font-size:14px;color:var(--text-soft);
  letter-spacing:.04em;font-weight:400;
}
 
/* ─ フォームカード ─────────────────────── */
.form-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:36px 40px;
  box-shadow:var(--sh-md);
  margin-bottom:32px;
}
 
/* ─ フィールド ─────────────────────────── */
.field-group{margin-bottom:24px}
.field-group:last-child{margin-bottom:0}
 
.field-label-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:8px;
}
.field-label{
  font-size:13px;font-weight:600;
  color:var(--text-dark);letter-spacing:.02em;
}
.field-error{
  font-size:12px;color:var(--danger);
  font-weight:500;
  opacity:0;transform:translateX(-4px);
  transition:opacity .2s,transform .2s;
}
.field-error.show{opacity:1;transform:translateX(0)}
 
.input-wrap{
  position:relative;
  display:flex;align-items:center;
}
.input-icon{
  position:absolute;left:14px;
  color:var(--text-soft);opacity:.6;
  pointer-events:none;
  transition:opacity .2s,color .2s;
}
.field-input{
  width:100%;
  padding:13px 44px 13px 44px;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  font-family:var(--font);font-size:14px;color:var(--text-dark);
  outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.field-input::placeholder{color:var(--text-soft)}
.field-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(43,91,165,.1);
  background:var(--white);
}
.field-input:focus + .input-icon,
.input-wrap:focus-within .input-icon{
  opacity:1;color:var(--accent);
}
.field-input.error{
  border-color:var(--danger);
  box-shadow:0 0 0 3px rgba(197,48,48,.08);
}
 
/* パスワード表示ボタン */
.toggle-pw{
  position:absolute;right:12px;
  background:none;border:none;cursor:pointer;
  color:var(--text-soft);padding:4px;
  display:flex;align-items:center;
  transition:color .2s;
  border-radius:4px;
}
.toggle-pw:hover{color:var(--text-dark)}
 
/* ─ CapsLock警告 ────────────────────────── */
.caps-warn{
  display:none;
  align-items:center;gap:5px;
  font-size:11px;color:#a07800;
  margin-top:6px;
}
.caps-warn.show{display:flex}
 
/* ─ ログインボタン ─────────────────────── */
.btn-login{
  width:100%;padding:14px;
  background:var(--text-dark);color:#fff;
  border:none;border-radius:var(--radius-sm);
  font-family:var(--font);font-size:15px;font-weight:600;
  cursor:pointer;letter-spacing:.04em;
  transition:background .2s,transform .15s,box-shadow .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:28px;
  position:relative;overflow:hidden;
}
.btn-login:hover{background:#333;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{background:#aaa;cursor:not-allowed;transform:none;box-shadow:none}
 
/* ローディングスピナー */
.spinner{
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .6s linear infinite;
  display:none;
}
.btn-login.loading .spinner{display:block}
.btn-login.loading .btn-text{opacity:0}
 
/* ─ シェイクアニメーション ────────────── */
@keyframes shake{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-8px)}
  30%{transform:translateX(8px)}
  45%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}
  75%{transform:translateX(-3px)}
  90%{transform:translateX(3px)}
}
.form-card.shake{animation:shake .5s ease}
 
/* ─ デモ用ヒント ────────────────────────── */
.demo-hint{
  background:#eef3fb;
  border:1px solid #c8d8f0;
  border-radius:var(--radius-sm);
  padding:12px 16px;
  margin-top:16px;
  font-size:12px;color:var(--accent);
  display:flex;align-items:flex-start;gap:8px;
  line-height:1.6;
}
.demo-hint svg{flex-shrink:0;margin-top:1px;opacity:.7}
 
/* ─ フッター ────────────────────────────── */
.footer{
  text-align:center;
  font-size:12px;color:var(--text-soft);
  letter-spacing:.04em;
}
 
/* ─ 言語ドロップダウン ─────────────────── */
.lang-overlay{position:fixed;inset:0;background:rgba(0,0,0,.18);backdrop-filter:blur(1px);z-index:200;opacity:0;pointer-events:none;transition:opacity 200ms}
.lang-overlay.show{opacity:1;pointer-events:all}
.lang-dropdown{position:fixed;z-index:201;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:0 8px 32px rgba(0,0,0,.16);min-width:200px;overflow:hidden;opacity:0;pointer-events:none;transform:translateY(-6px) scale(.97);transform-origin:top right;transition:opacity 180ms,transform 180ms}
.lang-dropdown.show{opacity:1;pointer-events:all;transform:translateY(0) scale(1)}
.lang-dropdown-header{padding:10px 14px 8px;font-size:10px;font-weight:600;color:var(--text-soft);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--border)}
.lang-option{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background var(--tr);font-size:13px;color:var(--text-dark)}
.lang-option:hover{background:var(--hover-bg)}.lang-option.active{background:#eef3fb;color:var(--accent);font-weight:500}
.lang-flag{font-size:16px;line-height:1;flex-shrink:0}.lang-label-main{font-weight:500}
.lang-label-sub{font-size:11px;color:var(--text-soft);margin-left:auto;font-family:var(--mono)}
.lang-check{margin-left:auto;color:var(--accent);font-size:14px;display:none}.lang-option.active .lang-check{display:block}.lang-option.active .lang-label-sub{display:none}
 
/* ─ トースト ────────────────────────────── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text-dark);color:#fff;padding:11px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:opacity 200ms,transform 200ms;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
 
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
 
<!-- 右上ボタン -->
<div class="topbar-right">
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    <span id="langLabel">JP</span>
    <span class="chevron">▼</span>
  </button>
  <div class="device-btn">
    <svg width="14" height="16" viewBox="0 0 14 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="1" width="12" height="18" rx="2"/><line x1="5" y1="17" x2="9" y2="17"/></svg>
  </div>
</div>
 
<!-- メインコンテンツ -->
<div class="page">
  <div class="login-wrap">
 
    <!-- ブランドタイトル -->
    <div class="brand">
      <div class="brand-title">社員情報管理システム</div>
      <div class="brand-sub">Employee Management System</div>
    </div>
 
    <!-- フォームカード -->
    <div class="form-card" id="formCard">
 
      <!-- ログインID -->
      <div class="field-group">
        <div class="field-label-row">
          <span class="field-label">ログインID</span>
          <span class="field-error" id="errId">ログインIDを入力してください</span>
        </div>
        <div class="input-wrap">
          <input type="text" id="loginId" class="field-input"
            placeholder="ログインIDを入力"
            autocomplete="username"
            oninput="clearError('loginId','errId')"
            onkeydown="handleEnter(event)">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>
 
      <!-- パスワード -->
      <div class="field-group">
        <div class="field-label-row">
          <span class="field-label">パスワード</span>
          <span class="field-error" id="errPw">パスワードを入力してください</span>
        </div>
        <div class="input-wrap">
          <input type="password" id="loginPw" class="field-input"
            placeholder="パスワードを入力"
            autocomplete="current-password"
            oninput="clearError('loginPw','errPw')"
            onkeydown="handleEnter(event)"
            onkeyup="checkCapsLock(event)">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <!-- パスワード表示トグル -->
          <button class="toggle-pw" type="button" id="togglePwBtn" onclick="togglePassword()" title="パスワードを表示/非表示">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <!-- CapsLock警告 -->
        <div class="caps-warn" id="capsWarn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          CapsLockがオンになっています
        </div>
      </div>
 
      <!-- ログインボタン -->
      <button class="btn-login" id="loginBtn" onclick="doLogin()">
        <div class="spinner"></div>
        <span class="btn-text">ログイン</span>
      </button>
 
    </div><!-- /form-card -->
 
    <!-- デモ用ヒント -->
    <div class="demo-hint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <div>デモ用アカウント：ID <strong>admin</strong> ／ パスワード <strong>admin123</strong></div>
    </div>
 
    <!-- フッター -->
    <div class="footer">@2026 Employee Management System</div>
 
  </div>
</div>
 
<!-- 言語ドロップダウン -->
<div class="lang-overlay" id="langOverlay" onclick="closeLang()"></div>
<div class="lang-dropdown" id="langDropdown"><div class="lang-dropdown-header">言語を選択</div></div>
<div class="toast" id="toast"></div>
 
<script>
const LANGUAGES=[
  {code:'ja',flag:'🇯🇵',label:'日本語',sub:'Japanese',short:'JP'},
  {code:'en',flag:'🇺🇸',label:'English',sub:'English',short:'EN'},
  {code:'zh-tw',flag:'🇹🇼',label:'繁體字',sub:'Traditional',short:'TW'},
  {code:'zh-cn',flag:'🇨🇳',label:'简体字',sub:'Simplified',short:'CN'},
  {code:'ko',flag:'🇰🇷',label:'한국어',sub:'Korean',short:'KR'},
  {code:'es',flag:'🇪🇸',label:'Español',sub:'Spanish',short:'ES'},
  {code:'fr',flag:'🇫🇷',label:'Français',sub:'French',short:'FR'},
  {code:'de',flag:'🇩🇪',label:'Deutsch',sub:'German',short:'DE'},
  {code:'pt',flag:'🇧🇷',label:'Português',sub:'Portuguese',short:'PT'},
  {code:'it',flag:'🇮🇹',label:'Italiano',sub:'Italian',short:'IT'},
  {code:'vi',flag:'🇻🇳',label:'Tiếng Việt',sub:'Vietnamese',short:'VI'},
  {code:'th',flag:'🇹🇭',label:'ภาษาไทย',sub:'Thai',short:'TH'},
];
 
// デモ用アカウント
const ACCOUNTS = {
  'admin': 'admin123',
  'user':  'user123',
};
 
let currentLang='ja', pwVisible=false;
 
document.addEventListener('DOMContentLoaded',()=>{
  buildLangMenu();
  document.getElementById('loginId').focus();
});
 
/* ─ ログイン処理 ─────────────────────── */
function doLogin(){
  const id = document.getElementById('loginId').value.trim();
  const pw = document.getElementById('loginPw').value;
  let ok = true;
 
  if(!id){ showError('loginId','errId'); ok=false; }
  if(!pw){ showError('loginPw','errPw'); ok=false; }
  if(!ok) return;
 
  // ローディング開始
  const btn = document.getElementById('loginBtn');
  btn.classList.add('loading');
  btn.disabled = true;
 
  setTimeout(()=>{
    if(ACCOUNTS[id] && ACCOUNTS[id] === pw){
      // ログイン成功
      try{ localStorage.setItem('logged_in','true'); localStorage.setItem('login_user', id); }catch(e){}
      showToast('ログインしました');
      setTimeout(()=>location.href='employee_list.html', 800);
    } else {
      // ログイン失敗
      btn.classList.remove('loading');
      btn.disabled = false;
      // シェイクアニメーション
      const card = document.getElementById('formCard');
      card.classList.add('shake');
      card.addEventListener('animationend',()=>card.classList.remove('shake'),{once:true});
      // エラー表示
      showError('loginId','errId','IDまたはパスワードが正しくありません');
      showError('loginPw','errPw','');
      document.getElementById('loginPw').value='';
      document.getElementById('loginId').focus();
    }
  }, 800); // リアルなローディング感
}
 
function showError(inputId, errId, msg){
  const inp = document.getElementById(inputId);
  const err = document.getElementById(errId);
  inp.classList.add('error');
  if(msg !== undefined && msg !== '') err.textContent = msg;
  err.classList.add('show');
}
 
function clearError(inputId, errId){
  document.getElementById(inputId).classList.remove('error');
  document.getElementById(errId).classList.remove('show');
}
 
/* ─ Enter キーで送信 ─────────────────── */
function handleEnter(e){ if(e.key==='Enter') doLogin(); }
 
/* ─ パスワード表示切り替え ───────────── */
function togglePassword(){
  pwVisible = !pwVisible;
  const inp = document.getElementById('loginPw');
  const icon = document.getElementById('eyeIcon');
  inp.type = pwVisible ? 'text' : 'password';
  icon.innerHTML = pwVisible
    ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
}
 
/* ─ CapsLock 検知 ────────────────────── */
function checkCapsLock(e){
  const warn = document.getElementById('capsWarn');
  if(e.getModifierState && e.getModifierState('CapsLock')){
    warn.classList.add('show');
  } else {
    warn.classList.remove('show');
  }
}
 
/* ─ 言語メニュー ─────────────────────── */
function buildLangMenu(){
  const dd=document.getElementById('langDropdown'),hdr=dd.querySelector('.lang-dropdown-header');
  dd.innerHTML='';dd.appendChild(hdr);
  LANGUAGES.forEach(l=>{
    const opt=document.createElement('div');opt.className='lang-option'+(l.code===currentLang?' active':'');
    opt.innerHTML=`<span class="lang-flag">${l.flag}</span><span class="lang-label-main">${l.label}</span><span class="lang-label-sub">${l.sub}</span><span class="lang-check">✓</span>`;
    opt.onclick=()=>selectLang(l);dd.appendChild(opt);
  });
}
function toggleLang(){
  const btn=document.getElementById('langBtn'),dd=document.getElementById('langDropdown');
  if(dd.classList.contains('show')){closeLang();return}
  const r=btn.getBoundingClientRect();
  dd.style.top=(r.bottom+6)+'px';dd.style.right=(window.innerWidth-r.right)+'px';
  document.getElementById('langOverlay').classList.add('show');
  dd.classList.add('show');btn.classList.add('open');
}
function closeLang(){
  document.getElementById('langOverlay').classList.remove('show');
  document.getElementById('langDropdown').classList.remove('show');
  document.getElementById('langBtn').classList.remove('open');
}
function selectLang(l){currentLang=l.code;document.getElementById('langLabel').textContent=l.short;buildLangMenu();closeLang();showToast(`言語を「${l.label}」に変更しました`)}
 
let toastTimer;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLang()});
</script>
</body>
</html>
